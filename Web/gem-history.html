<section class="medit-timeline-section">
    <div class="timeline-container">
        
        <nav class="compact-nav">
            <div class="nav-track"></div>
            <div class="nav-tabs">
                <button class="nav-btn active" onclick="filterYear('2000')">2000 - 2014</button>
                <button class="nav-btn" onclick="filterYear('2015')">2015 - 2020</button>
                <button class="nav-btn" onclick="filterYear('2021')">2021 - Present</button>
            </div>
        </nav>

        <div class="timeline-content-grid">
            <div class="visual-glass-card">
                <div class="glow-effect"></div>
                <p class="visual-placeholder">Medit Innovation Visual</p>
            </div>

            <div class="history-glass-list">
                <div class="history-row">
                    <span class="row-year">2000</span>
                    <p class="row-desc">메디트 창립 (산업용 3차원 스캐너 독자 기술 확보)</p>
                </div>
                <div class="history-row">
                    <span class="row-year">2008</span>
                    <p class="row-desc">치과용 밀링 머신 및 덴탈 소프트웨어 솔루션 개발</p>
                </div>
                <div class="history-row">
                    <span class="row-year">2011</span>
                    <p class="row-desc">글로벌 덴탈 이미징 시장 본격 진출 및 파트너십 체결</p>
                </div>
            </div>
        </div>

    </div>
</section>

<style>
    /* 레퍼런스 특유의 맑고 투명한 블루 그라데이션 무드 반영 */
    .medit-timeline-section {
        padding: 60px 20px;
        background: linear-gradient(135deg, #FFFFFF 0%, #EFF5FC 50%, #F5F9FD 100%);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .timeline-container {
        max-width: 1040px;
        margin: 0 auto;
    }

    /* 내비게이션 트랙 컴팩트화 */
    .compact-nav { position: relative; margin-bottom: 40px; padding: 10px 0; }
    .nav-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background: rgba(0, 91, 234, 0.1); }
    .nav-tabs { display: flex; justify-content: space-between; }
    .nav-btn {
        background: none; border: none; cursor: pointer; padding-bottom: 12px;
        font-size: 0.95rem; font-weight: 600; color: #9CA3AF; transition: all 0.3s;
    }
    .nav-btn.active, .nav-btn:hover {
        color: #005BEA; font-weight: 700; border-bottom: 2px solid #005BEA;
    }

    /* 세로 길이를 줄이기 위한 2단 그리드 */
    .timeline-content-grid {
        display: grid; grid-template-columns: 1fr 1.3fr; gap: 40px; align-items: center;
    }

    /* 레퍼런스 스타일의 Glassmorphism 카드 구현 */
    .visual-glass-card {
        position: relative; aspect-ratio: 16 / 11;
        background: rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 24px; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 20px 40px rgba(0, 91, 234, 0.04), inset 0 1px 1px rgba(255,255,255,0.8);
        overflow: hidden;
    }
    .glow-effect {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(0,91,234,0.03) 0%, transparent 60%);
    }
    .visual-placeholder { color: #8B96A5; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.05em; }

    /* 리스트 영역 밀도 최적화 (세로 늘어짐 방지) */
    .history-glass-list {
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 24px; padding: 12px 24px;
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.02);
    }
    .history-row {
        display: flex; align-items: center; gap: 24px;
        padding: 18px 0; border-bottom: 1px solid rgba(0, 0, 0, 0.03);
    }
    .history-row:last-child { border-bottom: none; }
    .row-year {
        font-size: 1.1rem; font-weight: 800; color: #005BEA;
        min-width: 60px; letter-spacing: -0.01em;
    }
    .row-desc { font-size: 0.92rem; color: #374151; font-weight: 500; line-height: 1.4; }

    /* 모바일 반응형 압축 */
    @media (max-width: 768px) {
        .timeline-content-grid { grid-template-columns: 1fr; gap: 24px; }
        .nav-btn { font-size: 0.85rem; }
        .history-row { padding: 14px 0; }
    }
</style>

<script>
    // 탭 클릭 시 텍스트 및 활성화 상태 변경을 위한 가벼운 로직
    function filterYear(year) {
        const btns = document.querySelectorAll('.nav-btn');
        btns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        // 여기에 데이터 교체 또는 스크롤 인터랙션을 2~3줄로 컴팩트하게 추가 가능합니다.
    }
</script>
